[package]
name = "gram-10m-mainnet"
description = "GRAM 10M Mainnet reproducible verification package"
version = "1.0.0"
license = "MIT"

[contracts.JettonMinter]
src = "verified-source/gram-10m-mainnet/contracts/JettonMinter.tolk"

[lint]
max-warnings = 0

[lint.rules]
dict-type-use = "allow"
throw-requires-errors-enum = "allow"

[fmt]
width = 100
ignore = []

[build]
output-fift = "build/fift"

[import-mappings]
verified = "verified-source/gram-10m-mainnet/contracts"

# Authoritative reproducible compiler is pinned in package.json:
# @ton/tolk-js = 1.4.0. This manifest intentionally contains no floating toolchain tag.
